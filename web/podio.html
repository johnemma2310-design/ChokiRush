<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choki Rush – Podio en vivo</title>
<link rel="icon" href="/juego/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --fondo:#120f24; --panel:#1d1838; --amarillo:#ffd640; --verde:#5ae06e; --cian:#5adcf5; --rojo:#ec4040; --gris:#8c8c9e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:radial-gradient(ellipse at top,#2a2156 0%,var(--fondo) 60%); color:#f5f5f5;
    font-family:'Press Start 2P',monospace; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 28px 0; }
  h1 { margin:0; white-space:nowrap; font-size:clamp(16px,2.8vw,40px); color:var(--amarillo); text-shadow:4px 4px 0 #962d0a; letter-spacing:2px; }
  .vivo { font-size:clamp(9px,1vw,14px); color:var(--verde); margin-top:10px; }
  .vivo::before { content:'●'; margin-right:8px; animation:latido 1s infinite; }
  @keyframes latido { 50% { opacity:.2; } }
  .unete { display:flex; align-items:center; gap:14px; background:var(--panel); border:3px solid var(--amarillo); padding:10px 14px; }
  .unete small { display:block; color:var(--gris); font-size:clamp(8px,.8vw,12px); margin-bottom:8px; }
  .unete b { font-size:clamp(9px,1.1vw,16px); color:var(--cian); word-break:break-all; }
  #qr { background:#fff; padding:6px; line-height:0; }
  nav { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:14px 10px 0; }
  nav button { font:inherit; font-size:clamp(8px,.9vw,13px); background:var(--panel); color:var(--gris); border:3px solid #3c3464;
    padding:8px 12px; cursor:pointer; }
  nav button.activo { color:#111; background:var(--amarillo); border-color:var(--amarillo); }
  nav .sep { width:24px; }
  main { flex:1; position:relative; display:flex; align-items:flex-end; justify-content:center; gap:clamp(6px,1.4vw,22px);
    padding:0 2vw 3vh; }
  .col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; width:clamp(90px,16vw,240px); height:100%; }
  .col canvas { image-rendering:pixelated; display:block; }
  .bloque { width:100%; height:0; transition:height .9s cubic-bezier(.2,1.4,.4,1); display:flex; flex-direction:column;
    align-items:center; padding-top:12px; gap:10px; overflow:hidden; box-shadow:inset 6px 0 0 rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.25); }
  .puesto { font-size:clamp(20px,3.4vw,52px); text-shadow:4px 4px 0 rgba(0,0,0,.35); }
  .dif { font-size:clamp(7px,.75vw,11px); padding:4px 6px; background:rgba(0,0,0,.35); }
  .nombre { margin-top:12px; font-size:clamp(9px,1.2vw,18px); text-align:center; min-height:1.2em; }
  .puntos { margin-top:8px; font-size:clamp(9px,1.2vw,18px); color:var(--amarillo); min-height:1.2em; }
  .vacio { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--gris); font-size:clamp(10px,1.4vw,20px); line-height:2; }
  footer { text-align:center; color:var(--gris); font-size:clamp(7px,.75vw,11px); padding:0 0 12px; }
  #confeti { position:fixed; inset:0; pointer-events:none; }
  .nuevo { animation:brillo 1.2s 3; }
  @keyframes brillo { 50% { filter:brightness(1.8); } }
  @media (max-width:700px) { header { flex-direction:column; } .unete { display:none; } }
</style>
</head>
<body>
<canvas id="confeti"></canvas>
<header>
  <div>
    <h1>CHOKI RUSH · TOP 5</h1>
    <div class="vivo">CLASIFICACION EN VIVO · <span id="jugadores">0</span> PILOTOS</div>
  </div>
  <div class="unete">
    <div id="qr"></div>
    <div><small>¡ESCANEA Y JUEGA!</small><b id="url"></b></div>
  </div>
</header>
<nav>
  <button data-dif="" class="activo">TODAS</button>
  <button data-dif="facil">FACIL</button>
  <button data-dif="normal">NORMAL</button>
  <button data-dif="dificil">DIFICIL</button>
  <span class="sep"></span>
  <button data-horas="0" class="activo">SIEMPRE</button>
  <button data-horas="3">ESTA CLASE</button>
</nav>
<main id="podio"></main>
<footer>SE ACTUALIZA SOLO CADA 3 SEGUNDOS · PROYECTALO EN EL SALON</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { dibujarMuneco, dibujarCorona, medidasMuneco, lienzoRetrato } from '/muneco.js';

const ORDEN = [3, 1, 0, 2, 4];
const ALTURAS = [0.34, 0.26, 0.2, 0.14, 0.1];
const COLORES = ['#ebb928', '#bec4d6', '#ce803e', '#605496', '#504880'];
const DIFS = { facil: ['FACIL', '#5ae06e'], normal: ['NORMAL', '#ffd640'], dificil: ['DIFICIL', '#ec4040'] };
const filtro = { dif: '', horas: '0' };
let ultimo = '';
let datos = [];
const columnas = [];

const url = location.origin + '/';
document.getElementById('url').textContent = url.replace(/^https?:\/\//, '');
try { new QRCode(document.getElementById('qr'), { text: url, width: 96, height: 96 }); } catch (e) {}

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  const grupo = b.dataset.dif !== undefined ? 'dif' : 'horas';
  document.querySelectorAll(`nav button[data-${grupo === 'dif' ? 'dif' : 'horas'}]`).forEach(x => x.classList.remove('activo'));
  b.classList.add('activo');
  filtro[grupo] = grupo === 'dif' ? b.dataset.dif : b.dataset.horas;
  ultimo = '';
  cargar();
}));

function escala() { return Math.max(3, Math.min(9, Math.floor(window.innerHeight / 150))); }

function construir() {
  const main = document.getElementById('podio');
  main.innerHTML = '';
  columnas.length = 0;
  if (!datos.length) {
    main.innerHTML = '<div class="vacio">AUN NO HAY PUNTAJES<br>¡SE EL PRIMERO EN JUGAR!</div>';
    return;
  }
  const altoMain = main.clientHeight;
  ORDEN.forEach((puesto, i) => {
    const col = document.createElement('div');
    col.className = 'col';
    const e = datos[puesto];
    if (e) {
      const m = medidasMuneco(e.piloto);
      const k = puesto === 0 ? escala() + 1 : escala();
      const ret = lienzoRetrato(e.piloto && e.piloto.retrato);
      const cv = document.createElement('canvas');
      let R = 0, km = 0;
      if (ret) {                               // retrato grande (211 px) + muñeco pequeño bailando
        const anchoCol = Math.min(240, Math.max(90, innerWidth * 0.16));
        R = Math.floor(Math.min(anchoCol, altoMain * (puesto === 0 ? 0.46 : 0.36)));
        km = Math.max(2, Math.floor(R / 50));
        cv.width = R;
        cv.height = R + 44;
      } else {
        cv.width = (m.ancho + 2) * k;
        cv.height = (m.alto + 26) * k;
      }
      cv.style.width = cv.width + 'px';
      col.appendChild(cv);
      const bloque = document.createElement('div');
      bloque.className = 'bloque';
      bloque.style.background = COLORES[puesto];
      const [nd, cd] = DIFS[e.dificultad] || ['', '#fff'];
      bloque.innerHTML = `<div class="puesto">${puesto + 1}</div><div class="dif" style="color:${cd}">${nd}</div>`;
      col.appendChild(bloque);
      const nombre = document.createElement('div');
      nombre.className = 'nombre';
      nombre.textContent = e.nombre;
      const puntos = document.createElement('div');
      puntos.className = 'puntos';
      puntos.textContent = '000000';
      col.append(nombre, puntos);
      columnas.push({ cv, k, e, puesto, i, puntos, ret, R, km, inicio: performance.now() + (4 - puesto) * 300 });
      setTimeout(() => { bloque.style.height = Math.round(altoMain * ALTURAS[puesto]) + 'px'; }, 60 + (4 - puesto) * 300);
    }
    main.appendChild(col);
  });
}

function animar(t) {
  for (const c of columnas) {
    const ctx = c.cv.getContext('2d');
    ctx.clearRect(0, 0, c.cv.width, c.cv.height);
    const vivo = (t - c.inicio) / 1000;
    if (vivo < 0.6) continue;
    const m = medidasMuneco(c.e.piloto);
    const salto = c.puesto === 0 ? Math.abs(Math.sin(t / 250)) * 14 : Math.abs(Math.sin(t / 170 + c.i)) * 4;
    const caida = Math.max(0, 1 - (vivo - 0.6) / 0.35) * 22;
    const cuadro = Math.floor(t / 200 + c.i) % 2;
    if (c.ret) {
      const y = Math.round(40 - salto - caida * c.k);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(c.ret, 0, y, c.R, c.R);
      if (c.puesto === 0) dibujarCorona(ctx, (c.R - 10 * (c.km + 1)) >> 1, y - 5 * (c.km + 1), c.km + 1);
      const mx = c.R - m.ancho * c.km;
      const my = c.cv.height - m.alto * c.km - Math.abs(Math.sin(t / 150 + c.i)) * 6;
      dibujarMuneco(ctx, c.e.piloto, mx, Math.round(my), c.km, cuadro);
    } else {
      const y = (24 - salto / c.k * 1 - caida) * c.k;
      dibujarMuneco(ctx, c.e.piloto, c.k, Math.round(y), c.k, cuadro);
      if (c.puesto === 0) dibujarCorona(ctx, c.k + ((m.ancho - 10) >> 1) * c.k, Math.round(y) - 7 * c.k, c.k);
    }
    const objetivo = c.e.puntos;
    const mostrado = Math.min(objetivo, Math.round(objetivo * Math.min(1, (vivo - 0.6) / 1.2)));
    c.puntos.textContent = String(mostrado).padStart(6, '0');
  }
  pintarConfeti();
  requestAnimationFrame(animar);
}

async function cargar() {
  try {
    const q = new URLSearchParams({ limite: '5' });
    if (filtro.dif) q.set('dificultad', filtro.dif);
    if (filtro.horas !== '0') q.set('horas', filtro.horas);
    const r = await fetch('/api/puntajes?' + q, { cache: 'no-store' });
    const j = await r.json();
    document.getElementById('jugadores').textContent = j.jugadores ?? 0;
    const firma = JSON.stringify(j.puntajes.map(p => [p.nombre, p.puntos]));
    if (firma !== ultimo) {
      const lider = datos[0] && datos[0].nombre;
      const hayCambio = ultimo !== '';
      ultimo = firma;
      q.set('retratos', '1');                  // solo cuando cambia algo se bajan los retratos grandes
      const completo = await (await fetch('/api/puntajes?' + q, { cache: 'no-store' })).json();
      datos = completo.puntajes;
      construir();
      if (hayCambio || datos.length) lanzarConfeti(hayCambio && datos[0] && datos[0].nombre !== lider ? 260 : 120);
    }
  } catch (e) { console.warn(e); }
}

// ---------- confeti ----------
const cc = document.getElementById('confeti');
const cx = cc.getContext('2d');
let papeles = [];
function redimensionar() { cc.width = innerWidth; cc.height = innerHeight; }
addEventListener('resize', () => { redimensionar(); ultimo = ''; cargar(); });
redimensionar();
function lanzarConfeti(n) {
  const col = ['#ec4040', '#ffd640', '#5adcf5', '#5ae06e', '#aa64eb', '#fff'];
  for (let i = 0; i < n; i++) papeles.push({ x: Math.random() * cc.width, y: -Math.random() * cc.height * 0.5,
    v: 1.5 + Math.random() * 3, f: Math.random() * 6, c: col[i % col.length], s: 4 + Math.random() * 6 });
}
function pintarConfeti() {
  cx.clearRect(0, 0, cc.width, cc.height);
  for (const p of papeles) {
    p.y += p.v; p.f += 0.08;
    cx.fillStyle = p.c;
    cx.fillRect(p.x + Math.sin(p.f) * 12, p.y, p.s, p.s * Math.abs(Math.cos(p.f)) + 1);
  }
  papeles = papeles.filter(p => p.y < cc.height + 10);
}

cargar();
setInterval(cargar, 3000);
requestAnimationFrame(animar);
</script>
</body>
</html>
